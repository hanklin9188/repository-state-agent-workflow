[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-state-agent-workflow"
version = "0.8.0"
description = "Relevance-first repository runtime for coding agents with focused context, transactional checkpoints, and operator-safe lifecycle controls"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hank" }]
dependencies = [
  "rich>=14.2,<16",
]
keywords = [
  "coding-agents",
  "ai-agents",
  "agent-workflow",
  "repository-state",
  "context-engineering",
  "context-compiler",
  "context-retrieval",
  "relevance-first",
  "semantic-memory",
  "persistent-workstreams",
  "context-compaction",
  "context-rotation",
  "runtime-supervisor",
  "transactional-checkpoints",
  "tool-budget",
  "terminal-ui",
  "agent-observability",
  "developer-tools",
  "software-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
rsaw = "repo_state_agent.v7_cli:main"

[project.urls]
Homepage = "https://github.com/hanklin9188/repository-state-agent-workflow"
Documentation = "https://github.com/hanklin9188/repository-state-agent-workflow#documentation"
Repository = "https://github.com/hanklin9188/repository-state-agent-workflow"
Issues = "https://github.com/hanklin9188/repository-state-agent-workflow/issues"
Changelog = "https://github.com/hanklin9188/repository-state-agent-workflow/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_state_agent = ["templates/*.md", "templates/*.json", "templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/repo_state_agent/__main__.py" = ["I001"]
"src/repo_state_agent/runtime/supervisor.py" = ["UP035"]
"src/repo_state_agent/runtime/v6.py" = ["E501", "I001", "UP035", "UP037", "SIM105"]
"src/repo_state_agent/runtime/tui/v6.py" = ["E501", "I001", "UP037", "SIM105"]
"src/repo_state_agent/v6_cli.py" = ["E501", "I001"]
"src/repo_state_agent/v7_cli.py" = ["E501", "I001"]
"tests/test_v6_runtime.py" = ["E501", "I001", "F401"]
"tests/test_v6_tui.py" = ["E501", "I001"]
"tests/test_v7_hardening.py" = ["E501", "I001"]
"tests/test_codex_adapter_subprocess.py" = ["I001"]
"tests/test_codex_adapter_lifecycle.py" = ["I001"]
