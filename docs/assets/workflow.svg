<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">RSAW persistent workstream lifecycle</title>
<desc id="desc">A context epoch executes tasks, checkpoints state, and continues or rotates through a continuation gate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1280" height="420" rx="24" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="640" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Persistent workstream, bounded context epochs</text>
<g stroke-width="2">
<rect x="55" y="115" width="180" height="92" rx="18" fill="#e0f2fe" stroke="#0284c7"/><text x="145" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#0c4a6e">Minimal bootstrap</text><text x="145" y="178" text-anchor="middle" font-size="14" fill="#075985">AGENTS · ACTIVE · task</text>
<rect x="285" y="115" width="180" height="92" rx="18" fill="#ede9fe" stroke="#7c3aed"/><text x="375" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Context epoch</text><text x="375" y="178" text-anchor="middle" font-size="14" fill="#5b21b6">one or more adjacent tasks</text>
<rect x="515" y="115" width="180" height="92" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="605" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Checkpoint</text><text x="605" y="178" text-anchor="middle" font-size="14" fill="#166534">evidence + ACTIVE update</text>
<rect x="745" y="115" width="180" height="92" rx="18" fill="#fef3c7" stroke="#d97706"/><text x="835" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Continuation gate</text><text x="835" y="178" text-anchor="middle" font-size="14" fill="#92400e">deterministic decision</text>
<rect x="990" y="82" width="190" height="72" rx="16" fill="#ccfbf1" stroke="#0f766e"/><text x="1085" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#134e4a">CONTINUE</text><text x="1085" y="137" text-anchor="middle" font-size="13" fill="#115e59">same epoch</text>
<rect x="990" y="174" width="190" height="72" rx="16" fill="#f3e8ff" stroke="#9333ea"/><text x="1085" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#581c87">ROTATE</text><text x="1085" y="229" text-anchor="middle" font-size="13" fill="#6b21a8">fresh context</text>
<rect x="745" y="292" width="180" height="72" rx="16" fill="#fee2e2" stroke="#dc2626"/><text x="835" y="325" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">STOP</text><text x="835" y="347" text-anchor="middle" font-size="13" fill="#991b1b">human or external gate</text>
</g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M235 161 H285"/><path d="M465 161 H515"/><path d="M695 161 H745"/><path d="M925 145 C955 145 955 118 990 118"/><path d="M925 177 C955 177 955 210 990 210"/><path d="M835 207 V292"/><path d="M1085 82 C1085 34 375 34 375 115"/><path d="M1085 246 C1085 270 145 270 145 207"/></g>
<text x="640" y="397" text-anchor="middle" font-size="16" fill="#475569">Every task closes durably; the gate decides whether the model context continues.</text>
</g></svg>
