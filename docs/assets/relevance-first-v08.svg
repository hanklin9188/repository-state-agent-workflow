<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RSAW v0.8 relevance-first context architecture</title>
  <desc id="desc">Repository truth and a deterministic relevance index produce a bounded Focus context before Codex execution and transactional checkpointing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121d"/><stop offset="1" stop-color="#13152b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="58" y="58" font-size="30" font-weight="780" fill="#f8fafc">RSAW v0.8 · Relevance Before Inference</text>
    <text x="58" y="88" font-size="16" fill="#94a3b8">Keep complete truth outside the transcript; send a small, explainable working set to the model.</text>

    <g transform="translate(60 128)">
      <rect width="250" height="172" rx="20" fill="#0c2630" stroke="#2dd4bf" stroke-width="2"/>
      <text x="24" y="38" font-size="14" font-weight="800" fill="#5eead4">TRUTH</text>
      <text x="24" y="70" font-size="20" font-weight="740" fill="#f1f5f9">Repository authority</text>
      <text x="24" y="103" font-size="14" fill="#cbd5e1">ACTIVE.md · task contract</text>
      <text x="24" y="127" font-size="14" fill="#cbd5e1">governance · capsule</text>
      <text x="24" y="151" font-size="14" fill="#cbd5e1">evidence · checkpoints</text>
    </g>

    <g transform="translate(360 128)">
      <rect width="300" height="172" rx="20" fill="#0c2138" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="38" font-size="14" font-weight="800" fill="#7dd3fc">FOCUS</text>
      <text x="24" y="70" font-size="20" font-weight="740" fill="#f1f5f9">Deterministic retrieval</text>
      <text x="24" y="103" font-size="14" fill="#cbd5e1">SHA-256 index · symbols</text>
      <text x="24" y="127" font-size="14" fill="#cbd5e1">paths · tests · imports · diff</text>
      <text x="24" y="151" font-size="14" fill="#cbd5e1">≤20 candidates → ≤5 excerpts</text>
    </g>

    <g transform="translate(710 128)">
      <rect width="210" height="172" rx="20" fill="#181d3a" stroke="#818cf8" stroke-width="2"/>
      <text x="24" y="38" font-size="14" font-weight="800" fill="#a5b4fc">WORK</text>
      <text x="24" y="70" font-size="20" font-weight="740" fill="#f1f5f9">Codex worker</text>
      <text x="24" y="103" font-size="14" fill="#cbd5e1">bounded tools</text>
      <text x="24" y="127" font-size="14" fill="#cbd5e1">semantic edits</text>
      <text x="24" y="151" font-size="14" fill="#cbd5e1">typed result</text>
    </g>

    <g transform="translate(970 128)">
      <rect width="170" height="172" rx="20" fill="#26182f" stroke="#c084fc" stroke-width="2"/>
      <text x="22" y="38" font-size="14" font-weight="800" fill="#d8b4fe">GATE</text>
      <text x="22" y="70" font-size="20" font-weight="740" fill="#f1f5f9">Verify</text>
      <text x="22" y="103" font-size="14" fill="#cbd5e1">actual diff</text>
      <text x="22" y="127" font-size="14" fill="#cbd5e1">commands</text>
      <text x="22" y="151" font-size="14" fill="#cbd5e1">scope · artifacts</text>
    </g>

    <path d="M310 214 H350" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M660 214 H700" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M920 214 H960" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(84 366)">
      <rect width="318" height="176" rx="20" fill="#10221d" stroke="#34d399" stroke-width="2"/>
      <text x="24" y="38" font-size="19" font-weight="760" fill="#a7f3d0">Transactional checkpoint</text>
      <text x="24" y="72" font-size="14" fill="#d1fae5">render proposed ACTIVE</text>
      <text x="24" y="98" font-size="14" fill="#d1fae5">snapshot authority files</text>
      <text x="24" y="124" font-size="14" fill="#d1fae5">seal capsule + checkpoint</text>
      <text x="24" y="150" font-size="14" fill="#d1fae5">verify or roll back everything</text>
    </g>

    <g transform="translate(442 366)">
      <rect width="318" height="176" rx="20" fill="#211b10" stroke="#f59e0b" stroke-width="2"/>
      <text x="24" y="38" font-size="19" font-weight="760" fill="#fde68a">Live turn guard</text>
      <text x="24" y="72" font-size="14" fill="#fef3c7">tool calls · total output</text>
      <text x="24" y="98" font-size="14" fill="#fef3c7">peak output · broad discovery</text>
      <text x="24" y="124" font-size="14" fill="#fef3c7">pause before runaway growth</text>
      <text x="24" y="150" font-size="14" fill="#fef3c7">budget resets every turn</text>
    </g>

    <g transform="translate(800 366)">
      <rect width="318" height="176" rx="20" fill="#23182d" stroke="#e879f9" stroke-width="2"/>
      <text x="24" y="38" font-size="19" font-weight="760" fill="#f5d0fe">Provider pressure</text>
      <text x="24" y="72" font-size="14" fill="#fae8ff">measure total · cached · fresh</text>
      <text x="24" y="98" font-size="14" fill="#fae8ff">reuse unchanged Focus by hash</text>
      <text x="24" y="124" font-size="14" fill="#fae8ff">COMPACT at checkpoint boundary</text>
      <text x="24" y="150" font-size="14" fill="#fae8ff">do not extend an expensive thread</text>
    </g>

    <path d="M1055 300 C1055 338 970 350 950 358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M800 454 H770" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M442 454 H412" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M242 366 C242 334 190 318 185 308" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="600" width="1080" height="66" rx="16" fill="#0c1727" stroke="#273449"/>
    <text x="86" y="626" font-size="13" font-weight="800" fill="#64748b">ONE MENTAL MODEL</text>
    <text x="86" y="650" font-size="16" font-weight="700" fill="#e2e8f0">Truth → Focus → Work → Checkpoint</text>
    <text x="450" y="650" font-size="15" fill="#94a3b8">No vector DB · no embedding API · no LLM summarizer required</text>
  </g>
</svg>
