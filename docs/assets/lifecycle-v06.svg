<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">RSAW v0.6 lifecycle</title><desc id="desc">CONTINUE preserves working context, COMPACT preserves semantic state, ROTATE creates independent cognition, PAUSE waits on gates, COMPLETE closes the workstream.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#141827"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1500" height="650" rx="28" fill="url(#bg)"/>
<text x="750" y="65" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800">Checkpoint persists. Context changes only for a reason.</text>
<text x="750" y="104" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="18">RSAW v0.6 lifecycle semantics</text>
<g font-family="Inter,Segoe UI,sans-serif">
 <rect x="70" y="190" width="250" height="165" rx="24" fill="#102d38" stroke="#22d3ee" stroke-width="2"/><text x="195" y="235" text-anchor="middle" fill="#a5f3fc" font-size="25" font-weight="800">CONTINUE</text><text x="195" y="278" text-anchor="middle" fill="#cbd5e1" font-size="16">same role</text><text x="195" y="304" text-anchor="middle" fill="#cbd5e1" font-size="16">same objective</text><text x="195" y="330" text-anchor="middle" fill="#67e8f9" font-size="15">retain hot context</text>
 <rect x="350" y="190" width="250" height="165" rx="24" fill="#33250e" stroke="#f59e0b" stroke-width="2"/><text x="475" y="235" text-anchor="middle" fill="#fde68a" font-size="25" font-weight="800">COMPACT</text><text x="475" y="278" text-anchor="middle" fill="#cbd5e1" font-size="16">same role/objective</text><text x="475" y="304" text-anchor="middle" fill="#cbd5e1" font-size="16">context pressure</text><text x="475" y="330" text-anchor="middle" fill="#fbbf24" font-size="15">retain semantic state</text>
 <rect x="630" y="190" width="250" height="165" rx="24" fill="#2b1d42" stroke="#a78bfa" stroke-width="2"/><text x="755" y="235" text-anchor="middle" fill="#ddd6fe" font-size="25" font-weight="800">ROTATE</text><text x="755" y="278" text-anchor="middle" fill="#cbd5e1" font-size="16">role / scientific</text><text x="755" y="304" text-anchor="middle" fill="#cbd5e1" font-size="16">independence boundary</text><text x="755" y="330" text-anchor="middle" fill="#c4b5fd" font-size="15">fresh cognition</text>
 <rect x="910" y="190" width="250" height="165" rx="24" fill="#382313" stroke="#fb923c" stroke-width="2"/><text x="1035" y="235" text-anchor="middle" fill="#fed7aa" font-size="25" font-weight="800">PAUSE</text><text x="1035" y="278" text-anchor="middle" fill="#cbd5e1" font-size="16">human / external</text><text x="1035" y="304" text-anchor="middle" fill="#cbd5e1" font-size="16">gate not ready</text><text x="1035" y="330" text-anchor="middle" fill="#fdba74" font-size="15">persist and wait</text>
 <rect x="1190" y="190" width="240" height="165" rx="24" fill="#0e3228" stroke="#34d399" stroke-width="2"/><text x="1310" y="235" text-anchor="middle" fill="#a7f3d0" font-size="25" font-weight="800">COMPLETE</text><text x="1310" y="278" text-anchor="middle" fill="#cbd5e1" font-size="16">stop condition</text><text x="1310" y="304" text-anchor="middle" fill="#cbd5e1" font-size="16">satisfied</text><text x="1310" y="330" text-anchor="middle" fill="#6ee7b7" font-size="15">seal closure</text>
</g>
<g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M320 272h22"/><path d="M600 272h22"/><path d="M880 272h22"/><path d="M1160 272h22"/></g>
<rect x="160" y="430" width="1180" height="115" rx="24" fill="#0f172a" stroke="#334155"/>
<text x="750" y="473" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Durability is independent of context replacement</text>
<text x="750" y="512" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">checkpoint → seal evidence + state    |    governor → choose cognitive action</text>
<text x="750" y="596" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="17">COMPACT is an efficiency action · ROTATE is an independence action</text>
</svg>