<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RSAW v0.8 — Relevance-First Context Runtime</title>
  <desc id="desc">Truth, Focus, Work, Checkpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111d"/><stop offset="0.54" stop-color="#0c1a31"/><stop offset="1" stop-color="#19122e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="0.55" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="30" r="220" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="80" cy="620" r="230" fill="#2dd4bf" opacity="0.10" filter="url(#glow)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="80" y="70" width="122" height="38" rx="19" fill="#10243b" stroke="#334155"/>
    <text x="141" y="95" text-anchor="middle" font-size="16" font-weight="800" fill="#99f6e4">v0.8.0</text>
    <text x="80" y="232" font-size="112" font-weight="850" letter-spacing="-5" fill="url(#accent)">RSAW</text>
    <text x="80" y="290" font-size="37" font-weight="720" fill="#f8fafc">Relevance-First Context Runtime</text>
    <text x="80" y="340" font-size="22" fill="#a8b6ca">Keep truth durable. Send only what matters.</text>

    <g transform="translate(80 412)">
      <rect width="248" height="112" rx="20" fill="#0c2630" stroke="#2dd4bf"/>
      <text x="24" y="42" font-size="15" font-weight="800" fill="#5eead4">TRUTH</text>
      <text x="24" y="74" font-size="20" font-weight="720" fill="#f1f5f9">Exact authority</text>
      <text x="24" y="96" font-size="14" fill="#8fa4bd">repository state</text>
    </g>
    <text x="350" y="480" font-size="30" fill="#64748b">→</text>
    <g transform="translate(390 412)">
      <rect width="248" height="112" rx="20" fill="#0c2138" stroke="#38bdf8"/>
      <text x="24" y="42" font-size="15" font-weight="800" fill="#7dd3fc">FOCUS</text>
      <text x="24" y="74" font-size="20" font-weight="720" fill="#f1f5f9">Relevant context</text>
      <text x="24" y="96" font-size="14" fill="#8fa4bd">map + excerpts</text>
    </g>
    <text x="660" y="480" font-size="30" fill="#64748b">→</text>
    <g transform="translate(700 412)">
      <rect width="210" height="112" rx="20" fill="#181d3a" stroke="#818cf8"/>
      <text x="24" y="42" font-size="15" font-weight="800" fill="#a5b4fc">WORK</text>
      <text x="24" y="74" font-size="20" font-weight="720" fill="#f1f5f9">Bounded Codex</text>
      <text x="24" y="96" font-size="14" fill="#8fa4bd">edit + validate</text>
    </g>
    <text x="932" y="480" font-size="30" fill="#64748b">→</text>
    <g transform="translate(972 412)">
      <rect width="228" height="112" rx="20" fill="#26182f" stroke="#c084fc"/>
      <text x="24" y="42" font-size="15" font-weight="800" fill="#d8b4fe">CHECKPOINT</text>
      <text x="24" y="74" font-size="20" font-weight="720" fill="#f1f5f9">Verified state</text>
      <text x="24" y="96" font-size="14" fill="#8fa4bd">seal + recover</text>
    </g>
    <text x="1200" y="590" text-anchor="end" font-size="14" font-weight="750" fill="#64748b">REPOSITORY-STATE AGENT WORKFLOW</text>
  </g>
</svg>
