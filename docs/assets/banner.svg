<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Repository-State Agent Workflow</title>
  <desc id="desc">Make the repository remember, so the agent does not have to.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#123a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="50" r="180" fill="#2563eb" opacity="0.12"/>
  <circle cx="1190" cy="300" r="210" fill="#14b8a6" opacity="0.10"/>
  <g transform="translate(78 62)">
    <rect x="0" y="0" width="174" height="226" rx="26" fill="#0f2940" stroke="#5eead4" stroke-width="3"/>
    <rect x="25" y="28" width="124" height="40" rx="10" fill="#123a4a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="25" y="92" width="124" height="40" rx="10" fill="#123a4a" stroke="#5eead4" stroke-width="2"/>
    <rect x="25" y="156" width="124" height="40" rx="10" fill="#123a4a" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="43" cy="48" r="6" fill="#60a5fa"/>
    <circle cx="43" cy="112" r="6" fill="#5eead4"/>
    <circle cx="43" cy="176" r="6" fill="#93c5fd"/>
    <path d="M149 48 H201 M149 112 H226 M149 176 H201" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="220" cy="112" r="15" fill="#5eead4" opacity="0.9" filter="url(#glow)"/>
  </g>
  <g transform="translate(365 78)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Repository-State</text>
    <text x="0" y="62" dominant-baseline="hanging" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Agent Workflow</text>
    <rect x="0" y="137" width="540" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="166" dominant-baseline="hanging" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Make the repository remember, so the agent does not have to.</text>
    <text x="0" y="215" dominant-baseline="hanging" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="18">Repository-backed memory · Bounded sessions · Progressive disclosure · Evidence-gated quality</text>
  </g>
</svg>
