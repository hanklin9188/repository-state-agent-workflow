<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Repository-State Agent Workflow</title>
  <desc id="desc">Long-lived workstreams. Bounded model context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#123a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1115" cy="45" r="180" fill="#2563eb" opacity="0.12"/>
  <circle cx="1195" cy="305" r="210" fill="#14b8a6" opacity="0.10"/>
  <g transform="translate(56 54)">
    <rect x="0" y="0" width="245" height="250" rx="28" fill="#0f2940" stroke="#5eead4" stroke-width="3"/>
    <text x="28" y="30" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">PERSISTENT WORKSTREAM</text>
    <rect x="26" y="62" width="193" height="42" rx="10" fill="#123a4a" stroke="#60a5fa" stroke-width="2"/>
    <text x="44" y="88" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="16">Task checkpoint</text>
    <path d="M122 104 V126" stroke="#60a5fa" stroke-width="3"/>
    <rect x="26" y="126" width="193" height="42" rx="10" fill="#123a4a" stroke="#5eead4" stroke-width="2"/>
    <text x="44" y="152" fill="#ccfbf1" font-family="Arial, Helvetica, sans-serif" font-size="16">Continuation gate</text>
    <path d="M122 168 V190" stroke="#5eead4" stroke-width="3"/>
    <rect x="26" y="190" width="88" height="36" rx="9" fill="#0f3c46" stroke="#5eead4" stroke-width="2"/>
    <text x="43" y="213" fill="#ccfbf1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">CONTINUE</text>
    <rect x="131" y="190" width="88" height="36" rx="9" fill="#202a4a" stroke="#a78bfa" stroke-width="2"/>
    <text x="152" y="213" fill="#ede9fe" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ROTATE</text>
    <circle cx="122" cy="147" r="9" fill="#5eead4" filter="url(#glow)"/>
  </g>
  <g transform="translate(350 63)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Repository-State</text>
    <text x="0" y="59" dominant-baseline="hanging" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Agent Workflow</text>
    <rect x="0" y="132" width="585" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="160" dominant-baseline="hanging" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="25">Long-lived workstreams. Bounded model context.</text>
    <text x="0" y="209" dominant-baseline="hanging" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="17">Context epochs · Durable checkpoints · Continuation gates · Evidence-gated quality</text>
  </g>
</svg>
