name: v0.6 source hardening

on:
  push:
    branches: ["feat/v0.6.0-context-operating-system"]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6.0-context-operating-system
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch validation provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/repo_state_agent/runtime/v6.py")
          s = p.read_text(encoding="utf-8")
          old = '''    executed = [_s(x.get("command")) for x in event_info.get("commands", []) if isinstance(x, dict)]\n    for required in contract.get("validations", []):\n        if not any(_command_matches(required, command) for command in executed):\n            errors.append(f"VALIDATION_NOT_EXECUTED:{required}")\n'''
          new = '''    command_records = [x for x in event_info.get("commands", []) if isinstance(x, dict)]\n    executed = [_s(x.get("command")) for x in command_records]\n    for required in contract.get("validations", []):\n        matched = [\n            record\n            for record in command_records\n            if _command_matches(required, _s(record.get("command")))\n        ]\n        if not matched:\n            errors.append(f"VALIDATION_NOT_EXECUTED:{required}")\n            continue\n        completed = [\n            record\n            for record in matched\n            if _s(record.get("eventType")).endswith(".completed")\n        ]\n        if any(record.get("exitCode") not in {None, 0} for record in completed):\n            errors.append(f"VALIDATION_FAILED:{required}")\n        elif not completed:\n            warnings.append(f"VALIDATION_COMPLETION_STATUS_UNAVAILABLE:{required}")\n'''
          if old not in s:
              raise SystemExit("validation gate anchor not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          t = Path("tests/test_v6_runtime.py")
          text = t.read_text(encoding="utf-8")
          if "test_deterministic_gate_rejects_observed_validation_failure" not in text:
              text += '''\n\ndef test_deterministic_gate_rejects_observed_validation_failure(tmp_path: Path) -> None:\n    _repo(tmp_path)\n    state = ActiveState(\n        root=tmp_path,\n        active_path=tmp_path / "ACTIVE.md",\n        task_id="T1",\n        task_spec=tmp_path / "docs/tasks/T1.md",\n        required_reads=(),\n        next_action="implement",\n        stop_condition="pass",\n        next_role="Reviewer",\n        reasoning="Medium",\n        workstream_id="W",\n        epoch_id="E-1",\n        current_role="Builder",\n    )\n    before = hashlib.sha256((tmp_path / "ACTIVE.md").read_bytes()).hexdigest()\n    gate = deterministic_gate(\n        tmp_path,\n        state=state,\n        result=_result(changedFiles=[]),\n        active_sha_before=before,\n        changed_files=(),\n        event_info={\n            "commands": [\n                {\n                    "command": "python -m pytest -q",\n                    "eventType": "item.completed",\n                    "exitCode": 1,\n                }\n            ]\n        },\n        evidence_ids=set(),\n    )\n    assert gate.accepted is False\n    assert "VALIDATION_FAILED:python -m pytest -q" in gate.errors\n'''
              t.write_text(text, encoding="utf-8")
          PY
      - name: Validate patch
        run: |
          python -m compileall -q src tests
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q
      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/repo_state_agent/runtime/v6.py tests/test_v6_runtime.py
          if git diff --cached --quiet; then
            echo "No fixup required"
            exit 0
          fi
          git commit -m "fix: bind v0.6 validation gates to observed command status"
          git push origin HEAD:feat/v0.6.0-context-operating-system
