name: Format final v0.7 runtime

on:
  push:
    branches: ["feat/v0.7.0-operator-hardening"]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.7.0-operator-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Fix, format, and verify source
        run: |
          ruff check --fix src/repo_state_agent/runtime/v6.py
          ruff format src/repo_state_agent/runtime/v6.py
          python -m py_compile src/repo_state_agent/runtime/v6.py
          ruff check src/repo_state_agent/runtime/v6.py
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-v070-runtime.yml
          git add src/repo_state_agent/runtime/v6.py
          git commit -m "style: format final v0.7 runtime"
          git push origin HEAD:feat/v0.7.0-operator-hardening
