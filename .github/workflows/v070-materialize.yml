name: Materialize v0.7 operator hardening

on:
  push:
    branches: ["feat/v0.7.0-operator-hardening"]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.7.0-operator-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply source hardening
        run: |
          python scripts/materialize_v070_core.py
          if ! python -m py_compile src/repo_state_agent/runtime/v6.py; then
            nl -ba src/repo_state_agent/runtime/v6.py | sed -n '1300,1360p'
            exit 1
          fi
      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format and validate
        run: |
          ruff format .
          python -m compileall -q src tests
          ruff check .
          pytest -q
          rsaw verify .
          rsaw compile . --mode FRESH --json
          rsaw acceptance . --horizon all --json
          rsaw state normalize . --json
          git diff --check
          python -m build
      - name: Commit validated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v070-materialize.yml scripts/materialize_v070_core.py
          git add -A
          git commit -m "feat: harden RSAW v0.7 operator runtime"
          git push origin HEAD:feat/v0.7.0-operator-hardening
