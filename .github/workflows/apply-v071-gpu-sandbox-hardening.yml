name: Apply v0.7.1 GPU sandbox boundary hardening

on:
  push:
    branches: ["fix/v0.7.1-gpu-sandbox-boundary"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.1-gpu-sandbox-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply incident-derived patch
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/apply_v071.py" <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path.cwd()


          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def write(path: str, text: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")


          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact replacement, found {count}")
              write(path, text.replace(old, new, 1))


          def regex_once(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one regex replacement, found {count}")
              write(path, updated)


          # ------------------------------------------------------------------
          # Version metadata
          # ------------------------------------------------------------------
          replace_once("pyproject.toml", 'version = "0.7.0"', 'version = "0.7.1"')
          replace_once(
              "src/repo_state_agent/__init__.py",
              '__version__ = "0.7.0"',
              '__version__ = "0.7.1"',
          )
          replace_once("CITATION.cff", "version: 0.7.0", "version: 0.7.1")
          replace_once(
              ".github/workflows/ci.yml",
              'assert repo_state_agent.__version__ == "0.7.0"\n          assert version("repository-state-agent-workflow") == "0.7.0"',
              'assert repo_state_agent.__version__ == "0.7.1"\n          assert version("repository-state-agent-workflow") == "0.7.1"',
          )

          # ------------------------------------------------------------------
          # Codex adapter: resolve task sandbox for every turn.
          # ------------------------------------------------------------------
          codex = "src/repo_state_agent/runtime/codex.py"
          replace_once(
              codex,
              "CodexEventGuard = Callable[[dict[str, Any]], str | None]\n",
              "CodexEventGuard = Callable[[dict[str, Any]], str | None]\n"
              "_SANDBOXES = {\"read-only\", \"workspace-write\", \"danger-full-access\"}\n",
          )
          replace_once(
              codex,
              "        sandbox: str = \"workspace-write\",\n        approve_for_me: bool = False,",
              "        sandbox: str = \"workspace-write\",\n"
              "        task_sandbox_overrides: dict[str, str] | None = None,\n"
              "        forced_sandbox: str | None = None,\n"
              "        approve_for_me: bool = False,",
          )
          replace_once(
              codex,
              "        self.sandbox = sandbox\n        self.approve_for_me = approve_for_me",
              "        self.sandbox = sandbox\n"
              "        self.task_sandbox_overrides = {\n"
              "            str(task): str(mode)\n"
              "            for task, mode in (task_sandbox_overrides or {}).items()\n"
              "        }\n"
              "        self.forced_sandbox = forced_sandbox\n"
              "        for label, mode in {\n"
              "            \"default\": self.sandbox,\n"
              "            \"forced\": self.forced_sandbox,\n"
              "            **{f\"task:{task}\": value for task, value in self.task_sandbox_overrides.items()},\n"
              "        }.items():\n"
              "            if mode is not None and mode not in _SANDBOXES:\n"
              "                raise ValueError(f\"unsupported Codex sandbox for {label}: {mode}\")\n"
              "        self.approve_for_me = approve_for_me",
          )
          replace_once(
              codex,
              "    def doctor(self) -> AdapterDoctorResult:\n",
              "    def resolve_turn_settings(self, environment: dict[str, str]) -> dict[str, str]:\n"
              "        task_id = str(environment.get(\"RSAW_TASK_ID\") or \"\")\n"
              "        pre_resolved = str(environment.get(\"RSAW_RESOLVED_SANDBOX\") or \"\")\n"
              "        if pre_resolved:\n"
              "            sandbox = pre_resolved\n"
              "            source = str(environment.get(\"RSAW_SANDBOX_SOURCE\") or \"supervisor\")\n"
              "        elif self.forced_sandbox:\n"
              "            sandbox = self.forced_sandbox\n"
              "            source = \"CLI\"\n"
              "        elif task_id and task_id in self.task_sandbox_overrides:\n"
              "            sandbox = self.task_sandbox_overrides[task_id]\n"
              "            source = \"task override\"\n"
              "        else:\n"
              "            sandbox = self.sandbox\n"
              "            source = \"default\"\n"
              "        if sandbox not in _SANDBOXES:\n"
              "            raise ValueError(f\"unsupported Codex sandbox mode: {sandbox}\")\n"
              "        return {\"task\": task_id, \"sandbox\": sandbox, \"source\": source}\n\n"
              "    def doctor(self) -> AdapterDoctorResult:\n",
          )
          replace_once(
              codex,
              "        thread_id: str | None,\n    ) -> list[str]:",
              "        thread_id: str | None,\n        sandbox: str | None = None,\n    ) -> list[str]:",
          )
          replace_once(
              codex,
              '            command.extend(["--sandbox", self.sandbox])',
              '            command.extend(["--sandbox", sandbox or self.sandbox])',
          )
          replace_once(
              codex,
              "        command = self.build_command(\n            root=root,\n            last_message_path=last_message_path,\n            thread_id=thread_id,\n        )\n        env = os.environ.copy()\n        env.update(environment)",
              "        turn_settings = self.resolve_turn_settings(environment)\n"
              "        command = self.build_command(\n"
              "            root=root,\n"
              "            last_message_path=last_message_path,\n"
              "            thread_id=thread_id,\n"
              "            sandbox=turn_settings[\"sandbox\"],\n"
              "        )\n"
              "        env = os.environ.copy()\n"
              "        env.update(environment)\n"
              "        env[\"RSAW_RESOLVED_SANDBOX\"] = turn_settings[\"sandbox\"]\n"
              "        env[\"RSAW_SANDBOX_SOURCE\"] = turn_settings[\"source\"]",
          )

          # ------------------------------------------------------------------
          # CLI: task-aware profile, content-bound audits, clean expected exits.
          # ------------------------------------------------------------------
          cli = "src/repo_state_agent/v7_cli.py"
          replace_once(
              cli,
              "from . import cli as legacy_cli",
              "from . import __version__, cli as legacy_cli",
          )
          replace_once(
              cli,
              '_SANDBOXES = ("read-only", "workspace-write", "danger-full-access")\n',
              '_SANDBOXES = ("read-only", "workspace-write", "danger-full-access")\n'
              '_EXPECTED_OPERATOR_STATUSES = {"PAUSED", "COMPLETE", "LIMIT_REACHED", "DRY_RUN"}\n\n\n'
              'def _json_document_bytes(value: dict[str, Any]) -> bytes:\n'
              '    return (json.dumps(value, indent=2, sort_keys=True) + "\\n").encode("utf-8")\n\n\n'
              'def _sha256_bytes(value: bytes) -> str:\n'
              '    return hashlib.sha256(value).hexdigest()\n\n\n'
              'def _snapshot_file(path: Path) -> bytes | None:\n'
              '    return path.read_bytes() if path.is_file() else None\n\n\n'
              'def _restore_file(path: Path, snapshot: bytes | None) -> None:\n'
              '    if snapshot is None:\n'
              '        path.unlink(missing_ok=True)\n'
              '        return\n'
              '    path.parent.mkdir(parents=True, exist_ok=True)\n'
              '    path.write_bytes(snapshot)\n\n\n'
              'def _operator_action_path(root: Path, timestamp: str, suffix: str) -> Path:\n'
              '    slug = timestamp.replace(":", "").replace("+", "-")\n'
              '    return root / ".rsaw/state/operator-actions" / f"{slug}-{suffix}.json"\n\n\n'
              'def _write_operator_action(\n'
              '    root: Path, *, suffix: str, payload: dict[str, Any]\n'
              ') -> Path:\n'
              '    timestamp = str(payload.get("timestamp") or utc_now())\n'
              '    bound = {"schemaVersion": "rsaw.operator-action.v2", **payload, "timestamp": timestamp}\n'
              '    canonical = json.dumps(bound, sort_keys=True, separators=(",", ":")).encode("utf-8")\n'
              '    bound["contentSha256"] = hashlib.sha256(canonical).hexdigest()\n'
              '    path = _operator_action_path(root, timestamp, suffix)\n'
              '    atomic_write_json(path, bound)\n'
              '    return path\n',
          )
          regex_once(
              cli,
              r"def _resolve_codex_settings\(.*?\n\n\ndef _tool_budget",
              '''def _codex_profile(
              root: Path,
              *,
              requested_binary: str = "auto",
              requested_sandbox: str = "auto",
          ) -> dict[str, Any]:
              runtime = _runtime_config(root)
              codex = runtime.get("codex", {})
              if not isinstance(codex, dict):
                  codex = {}
              configured_binary = str(codex.get("binary") or runtime.get("codex_binary") or "codex")
              binary = configured_binary if requested_binary == "auto" else requested_binary
              default_sandbox = str(
                  codex.get("defaultSandbox") or runtime.get("sandbox") or "workspace-write"
              )
              if default_sandbox not in _SANDBOXES:
                  raise ValueError(f"unsupported default sandbox mode: {default_sandbox}")
              raw_overrides = codex.get("taskSandboxOverrides", {})
              if not isinstance(raw_overrides, dict):
                  raise ValueError("runtime.codex.taskSandboxOverrides must be an object")
              overrides: dict[str, str] = {}
              for task, mode in raw_overrides.items():
                  task_id = str(task).strip()
                  sandbox = str(mode).strip()
                  if not task_id:
                      raise ValueError("task sandbox override has an empty task ID")
                  if sandbox not in _SANDBOXES:
                      raise ValueError(f"unsupported sandbox for task {task_id}: {sandbox}")
                  overrides[task_id] = sandbox
              forced = None if requested_sandbox == "auto" else requested_sandbox
              if forced is not None and forced not in _SANDBOXES:
                  raise ValueError(f"unsupported CLI sandbox mode: {forced}")
              return {
                  "binary": binary,
                  "defaultSandbox": default_sandbox,
                  "taskSandboxOverrides": overrides,
                  "forcedSandbox": forced,
              }


          def _resolve_profile_sandbox(profile: dict[str, Any], task_id: str) -> tuple[str, str]:
              forced = profile.get("forcedSandbox")
              if forced:
                  return str(forced), "CLI"
              overrides = profile.get("taskSandboxOverrides", {})
              if isinstance(overrides, dict) and task_id in overrides:
                  return str(overrides[task_id]), "task override"
              return str(profile["defaultSandbox"]), "default"


          def _resolve_codex_settings(
              root: Path,
              *,
              requested_binary: str = "auto",
              requested_sandbox: str = "auto",
          ) -> tuple[str, str, str]:
              profile = _codex_profile(
                  root,
                  requested_binary=requested_binary,
                  requested_sandbox=requested_sandbox,
              )
              state = parse_active(root)
              sandbox, source = _resolve_profile_sandbox(profile, state.task_id)
              return str(profile["binary"]), sandbox, source


          def _tool_budget''',
          )
          replace_once(
              cli,
              "    binary, resolved_sandbox, sandbox_source = _resolve_codex_settings(\n        root,\n        requested_binary=codex_binary,\n        requested_sandbox=sandbox,\n    )\n    adapter = CodexAdapter(binary=binary, sandbox=resolved_sandbox, quiet=True)",
              "    profile = _codex_profile(\n"
              "        root,\n"
              "        requested_binary=codex_binary,\n"
              "        requested_sandbox=sandbox,\n"
              "    )\n"
              "    resolved_sandbox, sandbox_source = _resolve_profile_sandbox(profile, state.task_id)\n"
              "    binary = str(profile[\"binary\"])\n"
              "    adapter = CodexAdapter(\n"
              "        binary=binary,\n"
              "        sandbox=str(profile[\"defaultSandbox\"]),\n"
              "        task_sandbox_overrides=dict(profile[\"taskSandboxOverrides\"]),\n"
              "        forced_sandbox=profile.get(\"forcedSandbox\"),\n"
              "        quiet=True,\n"
              "    )",
          )
          replace_once(
              cli,
              '            "sandboxSource": sandbox_source,\n        },',
              '            "sandboxSource": sandbox_source,\n'
              '            "sandboxPolicy": ("CLI" if profile.get("forcedSandbox") else "task-aware"),\n'
              '            "taskSandboxOverrideCount": len(profile["taskSandboxOverrides"]),\n'
              '        },',
          )
          replace_once(
              cli,
              "    binary, sandbox, _ = _resolve_codex_settings(\n        root,\n        requested_binary=args.codex_bin,\n        requested_sandbox=args.sandbox,\n    )",
              "    profile = _codex_profile(\n"
              "        root,\n"
              "        requested_binary=args.codex_bin,\n"
              "        requested_sandbox=args.sandbox,\n"
              "    )\n"
              "    state = parse_active(root)\n"
              "    sandbox, sandbox_source = _resolve_profile_sandbox(profile, state.task_id)\n"
              "    binary = str(profile[\"binary\"])",
          )
          replace_once(
              cli,
              "        sandbox=sandbox,\n        approve_for_me=args.approve_for_me,",
              "        sandbox=str(profile[\"defaultSandbox\"]),\n"
              "        task_sandbox_overrides=dict(profile[\"taskSandboxOverrides\"]),\n"
              "        forced_sandbox=profile.get(\"forcedSandbox\"),\n"
              "        approve_for_me=args.approve_for_me,",
          )
          replace_once(
              cli,
              '        "sandbox": sandbox,\n    }',
              '        "sandbox": sandbox,\n'
              '        "sandbox_source": sandbox_source,\n'
              '        "sandbox_policy": ("CLI" if profile.get("forcedSandbox") else "task-aware"),\n'
              '    }',
          )
          replace_once(
              cli,
              "    if (\n        dashboard\n        and not args.strict_exit_codes\n        and result.status in {\"PAUSED\", \"COMPLETE\", \"LIMIT_REACHED\", \"DRY_RUN\"}\n    ):\n        return 0",
              "    if not args.strict_exit_codes and result.status in _EXPECTED_OPERATOR_STATUSES:\n"
              "        return 0",
          )

          regex_once(
              cli,
              r"def _gate\(argv: list\[str\]\) -> int:.*?\n\n\ndef _sandbox",
              '''def _gate(argv: list[str]) -> int:
              parser = argparse.ArgumentParser(prog="rsaw gate")
              sub = parser.add_subparsers(dest="action", required=True)
              show = sub.add_parser("show")
              show.add_argument("path", nargs="?", default=".")
              show.add_argument("--json", action="store_true")
              clear = sub.add_parser("clear")
              clear.add_argument("path", nargs="?", default=".")
              clear.add_argument("--reason", required=True)
              clear.add_argument("--yes", action="store_true")
              clear.add_argument("--json", action="store_true")
              args = parser.parse_args(argv)
              root = _root(args.path)
              state = parse_active(root)
              if args.action == "show":
                  payload = {
                      "humanGate": state.human_gate or None,
                      "continuation": state.continuation,
                      "reason": state.continuation_reason,
                  }
                  print(json.dumps(payload, indent=2) if args.json else payload)
                  return 0
              if not args.yes:
                  print("ERROR: gate clear requires --yes", file=sys.stderr)
                  return 2

              active_path = root / "ACTIVE.md"
              before = active_path.read_bytes()
              before_text = before.decode("utf-8")
              text = replace_section(before_text, "Human Gate", "None.")
              current_role = (state.current_role or "").strip().lower()
              next_role = (state.next_role or state.current_role or "").strip().lower()
              continuation = (
                  "ROTATE_REQUIRED"
                  if current_role and next_role and current_role != next_role
                  else "CONTINUE_ALLOWED"
              )
              text = replace_section(
                  text,
                  "Continuation Gate",
                  f"Decision: {continuation}\\nReason: OPERATOR_GATE_CLEARED:{args.reason.strip()}",
              )
              if "## Blockers" in text:
                  text = replace_section(text, "Blockers", "None.")
              text = text.replace("Human Gate active", "Human Gate cleared")
              after_text = canonicalize_active_text(text)
              after = after_text.encode("utf-8")
              action_path: Path | None = None
              try:
                  active_path.write_bytes(after)
                  verification = verify_repository(root)
                  if not verification.ok:
                      raise RuntimeError(
                          "gate clear would leave repository invalid: "
                          + ";".join(verification.errors)
                      )
                  action_path = _write_operator_action(
                      root,
                      suffix="gate-clear",
                      payload={
                          "action": "CLEAR_HUMAN_GATE",
                          "reason": args.reason.strip(),
                          "task": state.task_id,
                          "beforeSha256": _sha256_bytes(before),
                          "afterSha256": _sha256_bytes(after),
                          "continuation": continuation,
                          "timestamp": utc_now(),
                      },
                  )
              except Exception as exc:
                  active_path.write_bytes(before)
                  if action_path is not None:
                      action_path.unlink(missing_ok=True)
                  print(f"ERROR: {exc}", file=sys.stderr)
                  return 1

              payload = {
                  "status": "CLEARED",
                  "task": state.task_id,
                  "reason": args.reason.strip(),
                  "audit": action_path.relative_to(root).as_posix(),
              }
              print(json.dumps(payload, indent=2) if args.json else "Human Gate cleared")
              return 0


          def _sandbox''',
          )
          regex_once(
              cli,
              r"def _sandbox\(argv: list\[str\]\) -> int:.*?\n\n\ndef _help",
              '''def _sandbox(argv: list[str]) -> int:
              parser = argparse.ArgumentParser(prog="rsaw sandbox")
              sub = parser.add_subparsers(dest="action", required=True)
              show = sub.add_parser("show")
              show.add_argument("path", nargs="?", default=".")
              show.add_argument("--json", action="store_true")
              set_parser = sub.add_parser("set")
              set_parser.add_argument("path", nargs="?", default=".")
              set_parser.add_argument("--task", default="current")
              set_parser.add_argument("--mode", choices=_SANDBOXES, required=True)
              set_parser.add_argument("--reason", required=True)
              set_parser.add_argument("--yes", action="store_true")
              set_parser.add_argument("--json", action="store_true")
              clear = sub.add_parser("clear")
              clear.add_argument("path", nargs="?", default=".")
              clear.add_argument("--task", default="current")
              clear.add_argument("--reason", required=True)
              clear.add_argument("--yes", action="store_true")
              clear.add_argument("--json", action="store_true")
              args = parser.parse_args(argv)
              root = _root(args.path)
              state = parse_active(root)
              if args.action == "show":
                  binary, sandbox, source = _resolve_codex_settings(root)
                  payload = {
                      "task": state.task_id,
                      "binary": binary,
                      "sandbox": sandbox,
                      "source": source,
                  }
                  print(json.dumps(payload, indent=2) if args.json else payload)
                  return 0
              if not args.yes:
                  print("ERROR: sandbox changes require --yes", file=sys.stderr)
                  return 2

              task = state.task_id if args.task == "current" else args.task.strip()
              if not task:
                  print("ERROR: sandbox task ID must not be empty", file=sys.stderr)
                  return 2
              config_path = root / ".rsaw/config.json"
              before = _snapshot_file(config_path)
              config = _load_config(root)
              runtime = config.setdefault("runtime", {})
              if not isinstance(runtime, dict):
                  print("ERROR: runtime configuration must be an object", file=sys.stderr)
                  return 1
              codex = runtime.setdefault("codex", {})
              if not isinstance(codex, dict):
                  print("ERROR: runtime.codex must be an object", file=sys.stderr)
                  return 1
              overrides = codex.setdefault("taskSandboxOverrides", {})
              if not isinstance(overrides, dict):
                  print("ERROR: taskSandboxOverrides must be an object", file=sys.stderr)
                  return 1
              before_mode = overrides.get(task)
              if args.action == "set":
                  overrides[task] = args.mode
                  status = "SET"
                  suffix = "sandbox-set"
                  action = "SET_TASK_SANDBOX"
              else:
                  overrides.pop(task, None)
                  status = "CLEARED"
                  suffix = "sandbox-clear"
                  action = "CLEAR_TASK_SANDBOX"
              after_bytes = _json_document_bytes(config)
              action_path: Path | None = None
              try:
                  _save_config(root, config)
                  _codex_profile(root)
                  verification = verify_repository(root)
                  if not verification.ok:
                      raise RuntimeError(
                          "sandbox change would leave repository invalid: "
                          + ";".join(verification.errors)
                      )
                  action_path = _write_operator_action(
                      root,
                      suffix=suffix,
                      payload={
                          "action": action,
                          "reason": args.reason.strip(),
                          "task": task,
                          "beforeSandbox": before_mode,
                          "afterSandbox": overrides.get(task),
                          "beforeConfigSha256": (_sha256_bytes(before) if before is not None else None),
                          "afterConfigSha256": _sha256_bytes(after_bytes),
                          "timestamp": utc_now(),
                      },
                  )
              except Exception as exc:
                  _restore_file(config_path, before)
                  if action_path is not None:
                      action_path.unlink(missing_ok=True)
                  print(f"ERROR: {exc}", file=sys.stderr)
                  return 1
              payload = {
                  "status": status,
                  "task": task,
                  "sandbox": overrides.get(task),
                  "reason": args.reason.strip(),
                  "audit": action_path.relative_to(root).as_posix(),
              }
              print(json.dumps(payload, indent=2) if args.json else payload)
              return 0


          def _help''',
          )
          replace_once(
              cli,
              '"""Repository-State Agent Workflow (RSAW) v0.7',
              'f"""Repository-State Agent Workflow (RSAW) v{__version__}',
          )
          replace_once(
              cli,
              '  rsaw sandbox set . --task current --mode danger-full-access --yes',
              '  rsaw sandbox set . --task current --mode danger-full-access --reason "reviewed GPU boundary" --yes\n'
              '  rsaw sandbox clear . --task current --reason "boundary closed" --yes',
          )
          replace_once(
              cli,
              "    if not args or args[0] in {\"-h\", \"--help\", \"help\"}:\n        return _help()",
              "    if not args or args[0] in {\"-h\", \"--help\", \"help\"}:\n"
              "        return _help()\n"
              "    if args[0] in {\"-V\", \"--version\", \"version\"}:\n"
              "        print(f\"RSAW {__version__}\")\n"
              "        return 0",
          )

          # ------------------------------------------------------------------
          # Supervisor telemetry and sandbox-boundary rotation.
          # ------------------------------------------------------------------
          v6 = "src/repo_state_agent/runtime/v6.py"
          replace_once(
              v6,
              "    tool_budget_aborts: int = 0\n    occupancy_samples: list[float] = field(default_factory=list)",
              "    tool_budget_aborts: int = 0\n"
              "    sandbox_resolutions: list[dict[str, Any]] = field(default_factory=list)\n"
              "    occupancy_samples: list[float] = field(default_factory=list)",
          )
          replace_once(
              v6,
              "def supervise_v6(\n",
              '''def _resolve_adapter_turn_settings(
              adapter: AgentAdapter, environment: dict[str, str]
          ) -> dict[str, str]:
              resolver = getattr(adapter, "resolve_turn_settings", None)
              if not callable(resolver):
                  return {}
              value = resolver(dict(environment))
              if not isinstance(value, dict):
                  raise ValueError("adapter turn settings must be an object")
              task = _s(value.get("task")) or environment.get("RSAW_TASK_ID", "")
              sandbox = _s(value.get("sandbox"))
