name: Recover and validate RSAW v0.7.1 hardening

on:
  push:
    branches: ["fix/v0.7.1-gpu-sandbox-boundary"]

permissions:
  contents: write

jobs:
  recover:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.1-gpu-sandbox-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover the materializer from the oversized staging file
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-v071-gpu-sandbox-hardening.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start_marker = '          cat > "$RUNNER_TEMP/apply_v071.py" <<\'PY\''
          end_marker = '          PY'
          next_marker = '          python "$RUNNER_TEMP/apply_v071.py"'
          start = lines.index(start_marker) + 1
          candidates = [
              index
              for index in range(start, len(lines) - 1)
              if lines[index] == end_marker and lines[index + 1] == next_marker
          ]
          if len(candidates) != 1:
              raise SystemExit(f'could not identify unique materializer end: {candidates}')
          end = candidates[0]
          body = [
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ]
          text = '\n'.join(body) + '\n'
          helper_anchor = 'ROOT = Path.cwd()\n\n\n'
          helper = (
              'ROOT = Path.cwd()\n\n\n'
              'def _restore_embedded_block_indent(value: str) -> str:\n'
              '    lines = value.splitlines()\n'
              '    if not lines:\n'
              '        return value\n'
              '    return "\\n".join(\n'
              '        [lines[0], *[(" " * 10 + line if line else line) for line in lines[1:]]]\n'
              '    )\n\n\n'
          )
          if text.count(helper_anchor) != 1:
              raise SystemExit('materializer helper anchor changed')
          text = text.replace(helper_anchor, helper, 1)
          for anchor in (
              'replace_once(v6, old_turn, new_turn)',
              'replace_once(v6, old_decision, new_decision)',
          ):
              if text.count(anchor) != 1:
                  raise SystemExit(f'materializer block anchor changed: {anchor}')
              names = (
                  ('old_turn', 'new_turn')
                  if 'old_turn' in anchor
                  else ('old_decision', 'new_decision')
              )
              prefix = '\n'.join(
                  f'{name} = _restore_embedded_block_indent({name})' for name in names
              )
              text = text.replace(anchor, prefix + '\n' + anchor, 1)
          target = Path('/tmp/apply_v071.py')
          target.write_text(text, encoding='utf-8')
          compile(text, str(target), 'exec')
          print(f'recovered {len(body)} lines')
          PY
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply incident-derived patch
        run: python /tmp/apply_v071.py
      - name: Format and full validation
        run: |
          ruff format .
          python -m compileall -q src tests
          ruff format --check .
          ruff check .
          pytest -q
          rsaw verify .
          rsaw footprint . --max-tokens 15000
          rsaw compile . --mode FRESH --json
          rsaw run . --dry-run --json
          rsaw report . --json
          rsaw acceptance . --horizon all --json
          rsaw --version
          python -m repo_state_agent --version
          python scripts/check_markdown_links.py .
          rm -rf dist build src/*.egg-info
          python -m build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v071-gpu-sandbox-hardening.yml
          git rm .github/workflows/recover-v071-hardening.yml
          git add -A
          git commit -m "fix: harden per-turn GPU sandbox boundaries for v0.7.1"
          git push origin HEAD:fix/v0.7.1-gpu-sandbox-boundary
