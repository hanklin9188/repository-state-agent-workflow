name: Recover and validate RSAW v0.7.1 hardening

on:
  push:
    branches: ["fix/v0.7.1-gpu-sandbox-boundary"]

permissions:
  contents: write

jobs:
  recover:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.1-gpu-sandbox-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover the materializer from the oversized staging file
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-v071-gpu-sandbox-hardening.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start_marker = '          cat > "$RUNNER_TEMP/apply_v071.py" <<\'PY\''
          end_marker = '          PY'
          next_marker = '          python "$RUNNER_TEMP/apply_v071.py"'
          start = lines.index(start_marker) + 1
          candidates = [
              index
              for index in range(start, len(lines) - 1)
              if lines[index] == end_marker and lines[index + 1] == next_marker
          ]
          if len(candidates) != 1:
              raise SystemExit(f'could not identify unique materializer end: {candidates}')
          end = candidates[0]
          body = [
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ]
          text = '\n'.join(body) + '\n'
          helper_anchor = 'ROOT = Path.cwd()\n\n\n'
          helper = (
              'ROOT = Path.cwd()\n\n\n'
              'def _restore_embedded_block_indent(value: str) -> str:\n'
              '    lines = value.splitlines()\n'
              '    if not lines:\n'
              '        return value\n'
              '    return "\\n".join(\n'
              '        [lines[0], *[(" " * 10 + line if line else line) for line in lines[1:]]]\n'
              '    )\n\n\n'
          )
          if text.count(helper_anchor) != 1:
              raise SystemExit('materializer helper anchor changed')
          text = text.replace(helper_anchor, helper, 1)
          for anchor in (
              'replace_once(v6, old_turn, new_turn)',
              'replace_once(v6, old_decision, new_decision)',
          ):
              if text.count(anchor) != 1:
                  raise SystemExit(f'materializer block anchor changed: {anchor}')
              names = (
                  ('old_turn', 'new_turn')
                  if 'old_turn' in anchor
                  else ('old_decision', 'new_decision')
              )
              prefix = '\n'.join(
                  f'{name} = _restore_embedded_block_indent({name})' for name in names
              )
              text = text.replace(anchor, prefix + '\n' + anchor, 1)
          target = Path('/tmp/apply_v071.py')
          target.write_text(text, encoding='utf-8')
          compile(text, str(target), 'exec')
          print(f'recovered {len(body)} lines')
          PY
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply incident-derived patch
        run: python /tmp/apply_v071.py
      - name: Normalize generated source and version regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          cli_path = Path('src/repo_state_agent/v7_cli.py')
          cli_text = cli_path.read_text(encoding='utf-8')
          broken_gate = (
              '        f"Decision: {continuation}\n'
              'Reason: OPERATOR_GATE_CLEARED:{args.reason.strip()}",'
          )
          fixed_gate = (
              '        (\n'
              '            f"Decision: {continuation}\\n"\n'
              '            f"Reason: OPERATOR_GATE_CLEARED:{args.reason.strip()}"\n'
              '        ),'
          )
          count = cli_text.count(broken_gate)
          if count != 1:
              raise SystemExit(f'expected one broken Gate reason literal, found {count}')
          cli_path.write_text(cli_text.replace(broken_gate, fixed_gate, 1), encoding='utf-8')

          test_path = Path('tests/test_v7_runtime_identity.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_assertion = '    assert \'"runtime": "v0.7"\' in events'
          new_assertion = '    assert \'"runtime": "v0.7.1"\' in events'
          count = test_text.count(old_assertion)
          if count != 1:
              raise SystemExit(f'expected one legacy runtime identity assertion, found {count}')
          test_path.write_text(
              test_text.replace(old_assertion, new_assertion, 1),
              encoding='utf-8',
          )
          PY
      - name: Generated-source syntax preflight
        run: |
          if ! python -m py_compile src/repo_state_agent/v7_cli.py; then
            nl -ba src/repo_state_agent/v7_cli.py | sed -n '625,665p'
            exit 1
          fi
          python -m py_compile src/repo_state_agent/runtime/codex.py
          python -m py_compile src/repo_state_agent/runtime/v6.py
          python -m py_compile tests/test_v71_gpu_sandbox_boundary.py
      - name: Format and full validation
        run: |
          ruff format .
          python -m compileall -q src tests
          ruff format --check .
          ruff check .
          pytest -q
          rsaw verify .
          rsaw footprint . --max-tokens 15000
          rsaw compile . --mode FRESH --json
          rsaw run . --dry-run --json
          rsaw report . --json
          rsaw acceptance . --horizon all --json
          rsaw --version
          python -m repo_state_agent --version
          python scripts/check_markdown_links.py .
          rm -rf dist build src/*.egg-info
          python -m build
      - name: Commit validated non-workflow patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows/ci.yml
          if ! git diff --quiet -- .github/workflows; then
            git diff -- .github/workflows
            echo "Refusing an Actions-bot workflow mutation."
            exit 1
          fi
          git add -A
          git commit -m "fix: harden per-turn GPU sandbox boundaries for v0.7.1"
          git push origin HEAD:fix/v0.7.1-gpu-sandbox-boundary
