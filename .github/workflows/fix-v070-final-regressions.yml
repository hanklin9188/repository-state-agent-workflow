name: Close final v0.7 regressions

on:
  push:
    branches: ["feat/v0.7.0-operator-hardening"]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.7.0-operator-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch exact regression causes
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          python -m pip install ruff
          ruff format src/repo_state_agent/runtime/v6.py tests/test_v7_hardening.py
          ruff check --fix src/repo_state_agent/runtime/v6.py tests/test_v7_hardening.py
          python -m py_compile src/repo_state_agent/runtime/v6.py tests/test_v7_hardening.py
      - name: Focused regression validation
        run: |
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_v6_runtime.py::test_synthetic_horizons_preserve_zero_manual_relay \
            tests/test_v7_hardening.py::test_post_advance_failure_rolls_back_all_authority_files
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-v070-final-regressions.yml
          git add src/repo_state_agent/runtime/v6.py tests/test_v7_hardening.py
          git commit -m "fix: close final lifecycle and rollback regressions"
          git push origin HEAD:feat/v0.7.0-operator-hardening
