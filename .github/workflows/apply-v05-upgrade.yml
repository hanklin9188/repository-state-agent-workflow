name: Apply RSAW 0.5 upgrade

on:
  push:
    branches:
      - feat/token-efficient-runtime-v5

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/token-efficient-runtime-v5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply core implementation
        run: python scripts/apply_v05_core.py

      - name: Apply documentation and visuals
        run: python scripts/apply_v05_docs.py

      - name: Apply compatibility fixes and remove staging files
        run: python scripts/apply_v05_fixes.py

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Normalize Python formatting
        run: |
          ruff check . --fix
          ruff format .
          ruff check .

      - name: Run test suite
        run: pytest -q

      - name: Validate repository and context plan
        run: |
          rsaw verify .
          rsaw context . --strict
          rsaw footprint . --max-tokens 15000
          rsaw run . --dry-run
          rsaw report . --json
          python scripts/check_markdown_links.py .

      - name: Commit generated upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: add cache-aware context runtime'
          git push origin HEAD:feat/token-efficient-runtime-v5
