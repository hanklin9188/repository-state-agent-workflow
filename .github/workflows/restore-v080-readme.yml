name: Restore RSAW v0.8.0 README

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore released README and remove this workflow
        run: |
          git fetch origin --tags
          git show v0.8.0:README.md > README.md
          rm .github/workflows/restore-v080-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/restore-v080-readme.yml
          git commit -m "docs: restore RSAW v0.8.0 README"
          git push origin HEAD:main
