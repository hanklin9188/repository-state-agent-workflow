name: Materialize validated RSAW 0.5 product tree

on:
  push:
    branches:
      - feat/token-efficient-runtime-v5-final

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/token-efficient-runtime-v5-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Fetch source branch
        run: git fetch origin feat/token-efficient-runtime-v5:refs/remotes/origin/feat/token-efficient-runtime-v5

      - name: Materialize implementation
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'version = "0.5.0"' pyproject.toml && [[ -f src/repo_state_agent/runtime/context.py ]]; then
            echo 'Product tree already materialized.'
          else
            git checkout origin/feat/token-efficient-runtime-v5 -- \
              scripts/apply_v05_core.py scripts/apply_v05_docs.py scripts/apply_v05_fixes.py
            python scripts/apply_v05_core.py
            python scripts/apply_v05_docs.py
            python scripts/apply_v05_fixes.py
          fi

      - name: Repair generated literal newlines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def repair(text: str) -> str:
              out = []
              i = 0
              quote = None
              triple = False
              escape = False
              comment = False
              while i < len(text):
                  ch = text[i]
                  if comment:
                      out.append(ch)
                      if ch == '\n': comment = False
                      i += 1
                      continue
                  if quote is None:
                      if ch == '#':
                          comment = True; out.append(ch); i += 1; continue
                      if text.startswith('"""', i) or text.startswith("'''", i):
                          quote = text[i]; triple = True; out.append(text[i:i+3]); i += 3; continue
                      if ch in {'"', "'"}:
                          quote = ch; triple = False; escape = False; out.append(ch); i += 1; continue
                      out.append(ch); i += 1; continue
                  if triple:
                      marker = quote * 3
                      if text.startswith(marker, i):
                          out.append(marker); i += 3; quote = None; triple = False; escape = False; continue
                      out.append(ch); i += 1; continue
                  if escape:
                      out.append(ch); escape = False; i += 1; continue
                  if ch == '\\':
                      out.append(ch); escape = True; i += 1; continue
                  if ch == quote:
                      out.append(ch); quote = None; i += 1; continue
                  if ch == '\n':
                      out.append('\\n'); i += 1; continue
                  out.append(ch); i += 1
              return ''.join(out)

          for path in list(Path('src').rglob('*.py')) + list(Path('tests').rglob('*.py')):
              original = path.read_text(encoding='utf-8')
              fixed = repair(original)
              if fixed != original:
                  path.write_text(fixed, encoding='utf-8')
          PY

      - name: Apply prompt/import compatibility hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/repo_state_agent/prompts.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from pathlib import Path\n\nfrom .continuation import decide_continuation',
              'from pathlib import Path\nfrom typing import TYPE_CHECKING\n\nfrom .continuation import decide_continuation'
          )
          text = text.replace(
              'from .runtime.config import RuntimeConfig, load_runtime_config\nfrom .runtime.context import ContextPlan, build_context_plan\n', ''
          )
          if 'if TYPE_CHECKING:' not in text:
              text = text.replace(
                  'VALID_ROLES = {',
                  'if TYPE_CHECKING:\n    from .runtime.config import RuntimeConfig\n    from .runtime.context import ContextPlan\n\n\nVALID_ROLES = {', 1
              )
          anchor = '    root = root.resolve()\n    state = parse_active(root)\n'
          if 'from .runtime.config import load_runtime_config' not in text:
              text = text.replace(
                  anchor,
                  '    from .runtime.config import load_runtime_config\n'
                  '    from .runtime.context import build_context_plan\n\n' + anchor, 1
              )
          text = text.replace(
              'Repository state is authoritative over conversation history. Keep the workstream\n'
              'durable and the model context bounded. Use progressive disclosure: read only the\n'
              'ordered context plan, then expand only when the active task requires evidence.\n',
              'Repository state is authoritative over conversation history. Do not reconstruct old\n'
              'chat history. Keep the workstream durable and the model context bounded. Use\n'
              'progressive disclosure: read only the ordered context plan, then expand only when\n'
              'the active task requires evidence.\n'
          )
          text = text.replace(
              '            "Reuse the current bounded context. Do not reread stable-prefix files unless",',
              '            "Read only:",\n            "Reuse the current bounded context. Do not reread stable-prefix files unless",'
          )
          text = text.replace(
              '    lines = ["Read only this ordered bootstrap context:", "", "Stable prefix:"]',
              '    lines = ["Read only:", "Use this ordered bootstrap context:", "", "Stable prefix:"]'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove non-product staging files
        run: |
          rm -f scripts/apply_v05_core.py scripts/apply_v05_docs.py scripts/apply_v05_fixes.py
          rm -f docs/releases/v05-materialization-trigger.txt

      - name: Validate complete product tree
        run: |
          python -m compileall -q src tests
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check . --fix
          ruff format .
          ruff check .
          pytest -q
          rsaw verify .
          rsaw context . --strict
          rsaw footprint . --max-tokens 15000
          rsaw run . --dry-run
          rsaw report . --json
          python scripts/check_markdown_links.py .
          python - <<'PY'
          from importlib.metadata import version
          import repo_state_agent
          from repo_state_agent.prompts import render_prompt
          assert repo_state_agent.__version__ == '0.5.0'
          assert version('repository-state-agent-workflow') == '0.5.0'
          assert callable(render_prompt)
          PY
          test -f src/repo_state_agent/runtime/context.py
          test -f src/repo_state_agent/runtime/rotation.py
          test -f docs/assets/runtime-architecture-v05.svg
          test -f docs/assets/context-lifecycle.svg
          test -f docs/assets/live-terminal-dashboard.svg
          rsaw context . --json | python -c "import json,sys; p=json.load(sys.stdin); assert p['stable_fingerprint']; assert p['dynamic_fingerprint']; assert p['within_budget']"
          rsaw prompt . --mode fresh | grep -q 'Stable prefix:'
          rsaw prompt . --mode continue | grep -q 'Do not reread stable-prefix files'

      - name: Write validation receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('docs/releases/rsaw-v5-validation.json').write_text(
              json.dumps({
                  'schema_version': 1,
                  'release': '0.5.0',
                  'status': 'VALIDATED',
                  'checks': ['compileall','ruff','pytest','rsaw_verify','strict_context_plan','footprint_gate','supervisor_dry_run','runtime_report','markdown_links','release_surface']
              }, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit product files only
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions may not update workflow files with this token. Preserve the
          # branch's workflow directory byte-for-byte; release plumbing is not product state.
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached -- . ':!.github/workflows'
          git diff --cached --quiet -- .github/workflows
          git commit -m 'feat: materialize RSAW 0.5 token-efficient runtime'
          git push origin HEAD:feat/token-efficient-runtime-v5-final

  compatibility:
    needs: materialize
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/token-efficient-runtime-v5-final
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: pytest -q
      - run: rsaw verify .
      - run: rsaw context . --strict
      - run: rsaw footprint . --max-tokens 15000
      - run: rsaw run . --dry-run
      - run: rsaw report . --json
      - run: python scripts/check_markdown_links.py .
      - run: test "$(python -c 'import repo_state_agent; print(repo_state_agent.__version__)')" = '0.5.0'
