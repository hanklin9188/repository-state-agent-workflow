name: Build clean RSAW 0.5 release candidate

on:
  push:
    branches:
      - feat/token-efficient-runtime-v5-clean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/token-efficient-runtime-v5-clean
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Fetch staged implementation source
        run: git fetch origin feat/token-efficient-runtime-v5:refs/remotes/origin/feat/token-efficient-runtime-v5

      - name: Materialize RSAW 0.5 implementation
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'version = "0.5.0"' pyproject.toml && [[ -f src/repo_state_agent/runtime/context.py ]]; then
            echo 'Main already contains the RSAW 0.5 implementation; validating current tree.'
          elif git cat-file -e origin/feat/token-efficient-runtime-v5:src/repo_state_agent/runtime/context.py 2>/dev/null && \
               git show origin/feat/token-efficient-runtime-v5:pyproject.toml | grep -q 'version = "0.5.0"'; then
            echo 'Copying the generated and previously validated RSAW 0.5 tree.'
            git checkout origin/feat/token-efficient-runtime-v5 -- .
          else
            echo 'Applying staged RSAW 0.5 generators.'
            git checkout origin/feat/token-efficient-runtime-v5 -- \
              scripts/apply_v05_core.py \
              scripts/apply_v05_docs.py \
              scripts/apply_v05_fixes.py
            python scripts/apply_v05_core.py
            python scripts/apply_v05_docs.py
            python scripts/apply_v05_fixes.py
          fi

      - name: Remove all staging and branch-only workflows
        shell: bash
        run: |
          rm -f scripts/apply_v05_core.py scripts/apply_v05_docs.py scripts/apply_v05_fixes.py
          rm -f .github/workflows/apply-v05-upgrade.yml
          rm -f .github/workflows/finalize-v05-upgrade.yml
          rm -f .github/workflows/release-v05-upgrade.yml
          rm -f .github/workflows/build-v05-clean.yml

      - name: Install and normalize
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check . --fix
          ruff format .
          ruff check .

      - name: Validate implementation and documentation
        run: |
          pytest -q
          rsaw verify .
          rsaw context . --strict
          rsaw footprint . --max-tokens 15000
          rsaw run . --dry-run
          rsaw report . --json
          python scripts/check_markdown_links.py .

      - name: Assert release surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib.metadata import version
          import repo_state_agent
          assert repo_state_agent.__version__ == '0.5.0'
          assert version('repository-state-agent-workflow') == '0.5.0'
          PY
          test -f src/repo_state_agent/runtime/context.py
          test -f src/repo_state_agent/runtime/rotation.py
          test -f docs/assets/runtime-architecture-v05.svg
          test -f docs/assets/context-lifecycle.svg
          test -f docs/assets/live-terminal-dashboard.svg
          rsaw context . --json | python -c "import json,sys; p=json.load(sys.stdin); assert p['stable_fingerprint']; assert p['dynamic_fingerprint']; assert p['within_budget']"
          rsaw run --help | grep -q -- '--max-fresh-input-tokens'
          rsaw run --help | grep -q -- '--min-cache-reuse-ratio'

      - name: Write validation receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              'schema_version': 1,
              'release': '0.5.0',
              'status': 'VALIDATED',
              'checks': [
                  'ruff', 'pytest', 'rsaw_verify', 'strict_context_plan',
                  'footprint_gate', 'supervisor_dry_run', 'runtime_report',
                  'markdown_links', 'release_surface'
              ],
              'python_prepare': '3.12'
          }
          Path('docs/releases/rsaw-v5-validation.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit validated release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes are required.'
          else
            git diff --cached --stat
            git commit -m 'feat: add cache-aware context runtime'
            git push origin HEAD:feat/token-efficient-runtime-v5-clean
          fi

  compatibility:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/token-efficient-runtime-v5-clean
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: rsaw verify .
      - run: rsaw context . --strict
      - run: rsaw footprint . --max-tokens 15000
      - run: rsaw run . --dry-run
      - run: rsaw report . --json
      - run: python scripts/check_markdown_links.py .
      - run: test "$(python -c 'import repo_state_agent; print(repo_state_agent.__version__)')" = '0.5.0'

  publish-pr:
    needs: compatibility
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/token-efficient-runtime-v5-clean
      - name: Create or locate pull request
        shell: bash
        run: |
          set -euo pipefail
          PR="$(gh pr list --repo '${{ github.repository }}' --head feat/token-efficient-runtime-v5-clean --base main --state open --json number --jq '.[0].number')"
          if [[ -z "$PR" ]]; then
            gh pr create --repo '${{ github.repository }}' \
              --head feat/token-efficient-runtime-v5-clean \
              --base main \
              --title 'feat: add cache-aware context runtime' \
              --body 'RSAW 0.5 adds deterministic context manifests, stable/dynamic fingerprints, cache-aware rotation, checkpoint-normalized efficiency metrics, updated Live Runtime Console observability, tests, documentation, and redesigned visuals. Lifecycle, safety, review, and scientific boundaries remain authoritative.'
          else
            echo "Pull request $PR already exists."
          fi
