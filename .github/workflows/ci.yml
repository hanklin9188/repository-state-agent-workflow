name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Static validation
        run: |
          python -m compileall -q src tests
          ruff check .
      - name: Test suite
        run: pytest -q
      - name: Repository and context validation
        run: |
          rsaw verify .
          rsaw footprint . --max-tokens 15000
          rsaw compile . --mode FRESH --json
          rsaw run . --dry-run
          rsaw report . --json
      - name: v0.6 lifecycle acceptance
        run: rsaw acceptance . --horizon all --json
      - name: Documentation links
        run: python scripts/check_markdown_links.py .
      - name: Build package
        run: python -m build
