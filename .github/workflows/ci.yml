name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Static validation
        run: |
          python -m compileall -q src tests
          ruff format --check .
          ruff check .
      - name: Test suite
        run: pytest -q
      - name: Repository and context validation
        run: |
          rsaw verify .
          rsaw footprint . --max-tokens 15000
          rsaw compile . --mode FRESH --json
          rsaw run . --dry-run --json
          rsaw report . --json
          rsaw acceptance . --horizon all --json
      - name: Unified operator CLI
        run: |
          rsaw --help
          python -m repo_state_agent --help
          rsaw upgrade . --json
          rsaw state normalize . --json
          git diff --exit-code -- ACTIVE.md
      - name: Codex preflight contract
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/codex" <<'SH'
          #!/usr/bin/env bash
          if [[ "$1" == "--version" ]]; then
            echo "codex-cli test-stub"
            exit 0
          fi
          if [[ "$1" == "exec" && "$2" == "--help" ]]; then
            echo "--json resume --output-last-message"
            exit 0
          fi
          if [[ "$1" == "login" && "$2" == "status" ]]; then
            echo "authenticated"
            exit 0
          fi
          exit 2
          SH
          chmod +x "$RUNNER_TEMP/fake-bin/codex"
          PATH="$RUNNER_TEMP/fake-bin:$PATH" rsaw preflight . --json
      - name: Documentation links
        run: python scripts/check_markdown_links.py .
      - name: Build package
        run: python -m build

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/rsaw-wheel"
          "$RUNNER_TEMP/rsaw-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/rsaw-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/rsaw-wheel/bin/python" - <<'PY'
          from importlib.metadata import version
          import repo_state_agent

          assert repo_state_agent.__version__ == "0.7.0"
          assert version("repository-state-agent-workflow") == "0.7.0"
          print(repo_state_agent.__version__)
          PY
          "$RUNNER_TEMP/rsaw-wheel/bin/rsaw" --help
          "$RUNNER_TEMP/rsaw-wheel/bin/python" -m repo_state_agent --help
