name: Repair v0.7 ACTIVE renderer template

on:
  push:
    branches: ["feat/v0.7.0-operator-hardening"]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.7.0-operator-hardening
          fetch-depth: 0
      - name: Preserve generated string escapes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/materialize_v070_core.py")
          text = path.read_text(encoding="utf-8")
          old = "    '''def _render_active_markdown(\n"
          new = "    r'''def _render_active_markdown(\n"
          if text.count(old) != 1:
              raise SystemExit(f"ACTIVE renderer template anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-v070-active-template.yml
          git add scripts/materialize_v070_core.py
          git commit -m "fix: preserve ACTIVE renderer escapes"
          git push origin HEAD:feat/v0.7.0-operator-hardening
