name: v0.6 horizon hardening

on:
  push:
    branches: ["fix/v06-horizon-acceptance"]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v06-horizon-acceptance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch synthetic horizon acceptance
        env:
          NEW_FUNC_B64: ""
          OLD_TEST_B64: ""
          NEW_TEST_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          p = Path("src/repo_state_agent/runtime/v6.py")
          s = p.read_text(encoding="utf-8")
          start = s.index("def synthetic_acceptance(root: Path, checkpoints: int) -> dict[str, Any]:")
          end = s.index("\n\ndef _v6_prompt", start)
          new_func = base64.b64decode(os.environ["NEW_FUNC_B64"]).decode()
          p.write_text(s[:start] + new_func + s[end:], encoding="utf-8")
          t = Path("tests/test_v6_runtime.py")
          text = t.read_text(encoding="utf-8")
          old = base64.b64decode(os.environ["OLD_TEST_B64"]).decode()
          new = base64.b64decode(os.environ["NEW_TEST_B64"]).decode()
          if old not in text:
              raise SystemExit("synthetic acceptance test anchor not found")
          t.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate hardening
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests
          ruff check .
          pytest -q
          rsaw acceptance . --horizon all --json
      - name: Commit lifecycle hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/repo_state_agent/runtime/v6.py tests/test_v6_runtime.py
          git commit -m "test: exercise COMPACT and reviewer rotation across horizons"
          git push origin HEAD:fix/v06-horizon-acceptance
