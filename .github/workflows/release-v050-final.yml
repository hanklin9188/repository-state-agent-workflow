name: Publish and tag validated RSAW 0.5.0

on:
  push:
    branches:
      - ops/release-v0.5.0-final

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/token-efficient-runtime-v5-final
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Require final validation receipt
        run: |
          test -f docs/releases/rsaw-v5-validation.json
          grep -q 'version = "0.5.0"' pyproject.toml
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('docs/releases/rsaw-v5-validation.json').read_text())
          assert p['release']=='0.5.0' and p['status']=='VALIDATED'
          assert 'import_cycle' in p['checks']
          assert 'prompt_compatibility' in p['checks']
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: rsaw verify .
      - run: rsaw context . --strict
      - run: rsaw footprint . --max-tokens 15000
      - run: rsaw run . --dry-run
      - run: rsaw report . --json
      - run: python scripts/check_markdown_links.py .

  publish:
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch final release candidate
        run: git fetch origin feat/token-efficient-runtime-v5-final:refs/remotes/origin/feat/token-efficient-runtime-v5-final
      - name: Import final release tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/feat/token-efficient-runtime-v5-final -- .
          rm -f .github/workflows/apply-v05-upgrade.yml
          rm -f .github/workflows/finalize-v05-upgrade.yml
          rm -f .github/workflows/release-v05-upgrade.yml
          rm -f .github/workflows/build-v05-clean.yml
          rm -f .github/workflows/merge-v05-clean.yml
          rm -f .github/workflows/ensure-v05-main.yml
          rm -f .github/workflows/tag-v050.yml
          rm -f .github/workflows/build-v05-final.yml
          rm -f .github/workflows/release-v050-final.yml
          rm -f scripts/apply_v05_core.py scripts/apply_v05_docs.py scripts/apply_v05_fixes.py
          test -f docs/releases/rsaw-v5-validation.json
          grep -q 'version = "0.5.0"' pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Final release validation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q
          rsaw verify .
          rsaw context . --strict
          rsaw footprint . --max-tokens 15000
          rsaw run . --dry-run
          rsaw report . --json
          python scripts/check_markdown_links.py .
      - name: Publish main and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add cache-aware context runtime'
            git push origin HEAD:main
          fi
          git fetch origin main --tags
          git checkout -B release-main origin/main
          grep -q 'version = "0.5.0"' pyproject.toml
          test -f docs/releases/rsaw-v5-validation.json
          if git rev-parse 'refs/tags/v0.5.0' >/dev/null 2>&1; then
            test "$(git rev-list -n 1 v0.5.0)" = "$(git rev-parse HEAD)"
          else
            git tag -a v0.5.0 -m 'RSAW 0.5.0 — Cache-Aware Context Runtime'
            git push origin v0.5.0
          fi
