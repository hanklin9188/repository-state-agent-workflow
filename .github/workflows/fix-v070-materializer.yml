name: Repair v0.7 materializer

on:
  push:
    branches: ["feat/v0.7.0-operator-hardening"]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.7.0-operator-hardening
          fetch-depth: 0
      - name: Make regex replacements literal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/materialize_v070_core.py")
          text = path.read_text(encoding="utf-8")
          old = '''    updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
'''
          new = '''    updated, count = re.subn(
        pattern,
        lambda _match: replacement,
        text,
        count=1,
        flags=re.MULTILINE | re.DOTALL,
    )
'''
          if old not in text:
              raise SystemExit("materializer helper anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-v070-materializer.yml
          git add scripts/materialize_v070_core.py
          git commit -m "fix: insert generated source literally"
          git push origin HEAD:feat/v0.7.0-operator-hardening
