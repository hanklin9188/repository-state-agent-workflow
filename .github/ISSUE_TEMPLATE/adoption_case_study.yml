name: Adoption case study
description: Share measured results from applying RSAW to a real repository
title: "[Case Study]: "
labels: [case-study]
body:
  - type: dropdown
    id: project_type
    attributes:
      label: Project type
      options:
        - Product / SaaS
        - Open-source software
        - ML / research
        - Data pipeline
        - Monorepo / migration
        - Other
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Study setup
      description: Agent/model, task sample, baseline, workflow version, and repository characteristics.
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: Outcomes
      description: Context, continuity, quality, handoff, token/cost, and failure observations.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations and negative results
      description: What did not improve, and what prevents generalization?
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Reproducibility artifacts
      description: Optional public data, config, prompts, commit, or analysis links.
